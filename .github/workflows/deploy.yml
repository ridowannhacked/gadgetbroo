name: Deploy to Contabo VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }} # usually 22
          script: |
            # Navigate to the project directory on the server
            # Note: You should update this path to where your project is stored on the VPS
            cd /var/www/gadgetbroo
            
            # Pull the latest changes from the main branch
            git pull origin main
            
            # Rebuild and restart the docker containers
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            
            # Remove old unused docker images to free up space
            docker image prune -f
