name: Deploy to VPS

on:
  push:
    branches: [master]

# Prevents two pushes in quick succession from running the deploy script
# on the server at the same time — that race is what caused the ENOTEMPTY
# npm ci failure (two `npm ci` runs touching node_modules simultaneously).
# A new push waits for the in-flight deploy to finish rather than canceling
# it, since a half-finished deploy on the server is worse than a short wait.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          command_timeout: 20m
          # The forced command= restriction on this key (see authorized_keys
          # on the server) ignores whatever we send here and always runs
          # /root/dev.gadgetbroo-deploy-entrypoint.sh instead. That entrypoint
          # git-pulls first, then execs scripts/deploy.sh as a fresh process —
          # see scripts/deploy.sh and AGENTS.md for why.
          script: /root/dev.gadgetbroo-deploy-entrypoint.sh
